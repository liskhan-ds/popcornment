<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>POPCORNMENT</title>
<meta name="description" content="오가는 길에 보는 베댓 모음">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🍿</text></svg>">
<style>
  :root {
    --bg: #ffffff;
    --fg: #101010;
    --muted: #8a8a8a;
    --line: #e7e7e7;
    --hover: #f6f6f6;
    --chip: #f0f0f0;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #101010;
      --fg: #f3f5f7;
      --muted: #777777;
      --line: #262626;
      --hover: #181818;
      --chip: #1e1e1e;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", "Noto Sans KR", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  header {
    position: sticky; top: 0; z-index: 1;
    background: color-mix(in srgb, var(--bg) 88%, transparent);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--line);
    text-align: center;
    padding: 14px 16px;
  }
  header h1 { margin: 0; font-size: 17px; font-weight: 700; letter-spacing: 0.02em; }
  main { max-width: 600px; margin: 0 auto; }
  .item {
    display: flex; gap: 12px;
    padding: 16px;
    border-bottom: 1px solid var(--line);
    color: inherit; text-decoration: none;
    transition: background 0.15s;
  }
  .item:hover { background: var(--hover); }
  .avatar {
    flex: none;
    width: 36px; height: 36px; border-radius: 50%;
    background: var(--chip);
    display: grid; place-items: center;
    font-size: 18px;
  }
  .body { min-width: 0; flex: 1; }
  .meta { display: flex; gap: 6px; align-items: baseline; font-size: 14px; margin-bottom: 3px; }
  .source { font-weight: 600; }
  .time { color: var(--muted); }
  .content {
    font-size: 15px; line-height: 1.5;
    white-space: pre-wrap; word-break: break-word; overflow-wrap: anywhere;
  }
  .hint { margin-top: 8px; font-size: 13px; color: var(--muted); }
  .status { padding: 48px 16px; text-align: center; color: var(--muted); }
</style>
</head>
<body>
<header><h1>🍿 POPCORNMENT</h1></header>
<main id="feed"><div class="status">불러오는 중…</div></main>

<script>
const SOURCE_NAMES = { fmkorea: "펨코" };

function timeAgo(iso) {
  const diff = (Date.now() - new Date(iso).getTime()) / 1000;
  if (diff < 60) return "방금";
  if (diff < 3600) return `${Math.floor(diff / 60)}분`;
  if (diff < 86400) return `${Math.floor(diff / 3600)}시간`;
  return `${Math.floor(diff / 86400)}일`;
}

function render(items) {
  const feed = document.getElementById("feed");
  if (!items.length) {
    feed.innerHTML = '<div class="status">아직 모인 댓글이 없어요.</div>';
    return;
  }
  // 최근 수집분이 위로, 같은 수집분 안에서는 추천이 많은 댓글이 위로 (추천수는 화면에 노출하지 않음)
  items.sort((a, b) => b.collected_at.localeCompare(a.collected_at) || b.votes - a.votes);
  feed.replaceChildren(...items.map(item => {
    const a = document.createElement("a");
    a.className = "item";
    a.href = item.post_url;
    a.target = "_blank";
    a.rel = "noopener noreferrer";
    a.innerHTML = `
      <div class="avatar">🍿</div>
      <div class="body">
        <div class="meta"><span class="source"></span><span class="time"></span></div>
        <div class="content"></div>
        <div class="hint">무슨 글이길래? →</div>
      </div>`;
    a.querySelector(".source").textContent = SOURCE_NAMES[item.source] || item.source;
    a.querySelector(".time").textContent = timeAgo(item.collected_at);
    a.querySelector(".content").textContent = item.content;
    return a;
  }));
}

fetch("feed.json", { cache: "no-store" })
  .then(res => res.ok ? res.json() : [])
  .then(render)
  .catch(() => {
    document.getElementById("feed").innerHTML = '<div class="status">피드를 불러오지 못했어요.</div>';
  });
</script>
</body>
</html>
