<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>POPCORNMENT</title>
<meta name="description" content="오가는 길에 보는 베댓 모음">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🍿</text></svg>">
<style>
  :root {
    --bg: #ffffff;
    --fg: #101010;
    --muted: #8a8a8a;
    --line: #e7e7e7;
    --hover: #f6f6f6;
    --chip: #f0f0f0;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #101010;
      --fg: #f3f5f7;
      --muted: #777777;
      --line: #262626;
      --hover: #181818;
      --chip: #1e1e1e;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", "Noto Sans KR", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  header {
    position: sticky; top: 0; z-index: 1;
    background: color-mix(in srgb, var(--bg) 88%, transparent);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--line);
    text-align: center;
    padding: 14px 16px;
  }
  header h1 { margin: 0; font-size: 17px; font-weight: 700; letter-spacing: 0.02em; }
  main { max-width: 600px; margin: 0 auto; }
  .item {
    display: flex; gap: 12px;
    padding: 16px;
    border-bottom: 1px solid var(--line);
    color: inherit; text-decoration: none;
    transition: background 0.15s;
  }
  .item:hover { background: var(--hover); }
  .avatar {
    flex: none;
    width: 36px; height: 36px; border-radius: 50%;
    overflow: hidden;
    background: var(--chip);
    display: grid; place-items: center;
    font-size: 18px;
  }
  .avatar svg { width: 100%; height: 100%; display: block; }
  .body { min-width: 0; flex: 1; }
  .meta { display: flex; gap: 6px; align-items: baseline; font-size: 14px; margin-bottom: 3px; }
  .time { color: var(--muted); }
  .content {
    font-size: 15px; line-height: 1.5;
    white-space: pre-wrap; word-break: break-word; overflow-wrap: anywhere;
  }
  .hint { margin-top: 8px; font-size: 13px; color: var(--muted); }
  .status { padding: 48px 16px; text-align: center; color: var(--muted); }
</style>
</head>
<body>
<header><h1>🍿 POPCORNMENT</h1></header>
<main id="feed"><div class="status">불러오는 중…</div></main>

<script>
// 출처는 이름 대신 아이콘으로만 표시 (간단한 자체 제작 SVG, 추후 정식 로고로 교체 가능)
const SOURCE_ICONS = {
  youtube: `<svg viewBox="0 0 36 36" aria-label="YouTube"><rect width="36" height="36" fill="#FF0000"/><path d="M14.5 12.5v11l9-5.5z" fill="#fff"/></svg>`,
  naver: `<svg viewBox="0 0 36 36" aria-label="Naver"><rect width="36" height="36" fill="#03C75A"/><path d="M12 11h4.2l3.6 5.4V11H24v14h-4.2l-3.6-5.4V25H12z" fill="#fff"/></svg>`,
  fmkorea: `<svg viewBox="0 0 36 36" aria-label="FMKorea"><rect width="36" height="36" fill="#3B5998"/><text x="18" y="23" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#fff">fm</text></svg>`,
};

function timeAgo(iso) {
  const diff = (Date.now() - new Date(iso).getTime()) / 1000;
  if (diff < 60) return "just now";
  if (diff < 3600) return `${Math.floor(diff / 60)}m`;
  if (diff < 86400) return `${Math.floor(diff / 3600)}h`;
  return `${Math.floor(diff / 86400)}d`;
}

function render(items) {
  const feed = document.getElementById("feed");
  if (!items.length) {
    feed.innerHTML = '<div class="status">아직 모인 댓글이 없어요.</div>';
    return;
  }
  // 댓글 작성 시각이 최근인 것이 위로 (작성 시각을 모르면 수집 시각 사용)
  const timeOf = item => new Date(item.created_at || item.collected_at).getTime();
  items.sort((a, b) => timeOf(b) - timeOf(a));
  feed.replaceChildren(...items.map(item => {
    const a = document.createElement("a");
    a.className = "item";
    a.href = item.post_url;
    a.target = "_blank";
    a.rel = "noopener noreferrer";
    a.innerHTML = `
      <div class="avatar">${SOURCE_ICONS[item.source] || "🍿"}</div>
      <div class="body">
        <div class="meta"><span class="time"></span></div>
        <div class="content"></div>
        <div class="hint">What's the tea? ☕</div>
      </div>`;
    a.querySelector(".time").textContent = timeAgo(item.created_at || item.collected_at);
    a.querySelector(".content").textContent = item.content;
    return a;
  }));
}

fetch("feed.json", { cache: "no-store" })
  .then(res => res.ok ? res.json() : [])
  .then(render)
  .catch(() => {
    document.getElementById("feed").innerHTML = '<div class="status">피드를 불러오지 못했어요.</div>';
  });
</script>
</body>
</html>
